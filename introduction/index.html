<!DOCTYPE html>
<html>
<head>
    <title>Flexbox - Flex Wrap</title>
    <link rel="stylesheet" href="css/mystyle.css">
</head>
<body>

    <img src="https://www.w3schools.com/css/img_mountains.jpg" alt="Person wearing a jacket" class="main-image">

    <h1>flex-wrap: wrap</h1>

    <p>
        flex-wrap: wrap; specifies that the flex items will wrap if necessary:
    </p>

    <div class="flex-container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>

    <p>Try resizing the browser window!</p>

</body>
</html>
